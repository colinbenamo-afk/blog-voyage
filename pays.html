<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Titre et description sont remplacés par pays.js une fois l'article chargé -->
  <title>Article – Mon Blog de Voyage</title>
  <meta name="description" content="Article de voyage : photos et souvenirs.">

  <!-- Mêmes polices que l'accueil : Melodrama + Nunito (assets/fonts/), Space Mono (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/Melodrama-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Nunito-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css">

  <!-- style.css : variables de couleurs, fond, header. pays.css : mise en page de l'article. -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pays.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

  <!-- Même header que l'accueil ; la liste des pays est remplie par pays.js -->
  <header class="site-header">
    <a href="index.html" class="site-header-logo-link">
      <img src="assets/logo.png" alt="Logo du blog de voyage – retour à l'accueil" class="site-header-logo-img" width="543" height="156">
    </a>
    <details class="site-header-nav">
      <summary>Les voyages</summary>
      <ul class="site-header-nav-list"></ul>
    </details>
  </header>

  <!-- ===================================================== -->
  <!-- 1. EN-TÊTE : titre de l'article + coordonnées         -->
  <!--    (photo de fond ajoutée par pays.js via --hero-photo) -->
  <!-- ===================================================== -->
  <div class="pays-hero" id="pays-hero">
    <h1 id="pays-titre"></h1>
    <p class="coords" id="pays-coords" hidden></p>
  </div>

  <!-- Le contenu de l'article (intro + galerie + blocs texte/photo) est
       généré par pays.js depuis data/articles/<id>.json -->
  <main id="pays-contenu"></main>

  <footer class="pays-footer">
    <a href="index.html" id="pays-retour">← Retour au blog</a>
  </footer>

  <script src="pays.js"></script>
</body>
</html>
